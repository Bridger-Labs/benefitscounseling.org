name: Deploy benefitscounseling.org

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on droplet
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PATH: ${{ secrets.DO_PATH }}
        run: |
          cat > deploy.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cd "$DO_PATH"
          git fetch origin main
          git checkout main
          git pull origin main

          npm ci
          npm run build

          sudo nginx -t
          sudo systemctl reload nginx
          EOF

          chmod +x deploy.sh
          scp deploy.sh ${DO_USER}@${DO_HOST}:/tmp/benefits_deploy.sh
          ssh ${DO_USER}@${DO_HOST} "DO_PATH='${DO_PATH}' bash /tmp/benefits_deploy.sh"

      - name: Health check (optional)
        env:
          DO_URL: ${{ secrets.DO_URL }}
        run: |
          if [ -n "${DO_URL}" ]; then
            curl -fsS "${DO_URL}" >/dev/null
            echo "Health check OK: ${DO_URL}"
          else
            echo "DO_URL not set; skipping health check"
          fi
